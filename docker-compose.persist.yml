# Persistent databases + services (no Eureka)
# Run: docker-compose -f docker-compose.persist.yml up -d
# Courses and enrollments persist across restarts (PostgreSQL volumes)

services:
  postgres-courses:
    image: postgres:16-alpine
    container_name: postgres-courses
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: courses_db
      POSTGRES_USER: esm
      POSTGRES_PASSWORD: esm_secret
    volumes:
      - pg-courses-data:/var/lib/postgresql/data
    networks:
      - esm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esm -d courses_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-enrollments:
    image: postgres:16-alpine
    container_name: postgres-enrollments
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: enrollments_db
      POSTGRES_USER: esm
      POSTGRES_PASSWORD: esm_secret
    volumes:
      - pg-enrollments-data:/var/lib/postgresql/data
    networks:
      - esm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esm -d enrollments_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  course-service:
    build: ./course-service
    container_name: course-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-courses:
        condition: service_healthy
    volumes:
      - course-uploads:/app/uploads
    networks:
      - esm-network

  enrollment-service:
    build: ./Enrollment-service
    container_name: enrollment-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres-enrollments:
        condition: service_healthy
      course-service:
        condition: service_started
    networks:
      - esm-network

networks:
  esm-network:
    driver: bridge

volumes:
  pg-courses-data:
  pg-enrollments-data:
  course-uploads:
