apiVersion: apps/v1
kind: Deployment

metadata:
  name: course-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: course-service

  template:
    metadata:
      labels:
        app: course-service

    spec:
      containers:
        - name: course-service
          image: you25/course-service:latest

          ports:
            - containerPort: 8083