<div class="min-h-screen">

  <div class="min-h-80 mb-12 flex items-center justify-center bg-violet-50 font-bold text-gray-800 relative">
    <h1 class="text-4xl">Sign In</h1>
    <img src="assets\images\herobanner__1.png"  alt="" class="absolute -bottom-10 left-10 animate-bounce ">
    <img src="assets\images\herobanner__2.png"  alt="" class="absolute -bottom-10 right-50 scale-50 lg:scale-150">
    <img src="assets\images\herobanner__3.png"  alt="" class="absolute top-5 left-50">
  </div>

  <div class="w-full max-w-xl mx-auto p-12 bg-white flex flex-col items-center rounded shadow-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Sign In</h2>

    <form class="space-y-6 container w-full" (ngSubmit)="onSubmit()">

      @if (error) {
        <div class="p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
          {{ error }}
        </div>
      }

      <div class="flex flex-col">
        <label for="email" class="mb-2 text-sm font-medium text-gray-700">
          Email or Username
        </label>
        <input
          id="email"
          name="email"
          type="text"
          [(ngModel)]="email"
          autocomplete="username"
          placeholder="Default: student"
          class="w-full border py-4 px-3 rounded border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"
          [disabled]="loading"
        />
      </div>

      <div class="flex flex-col">
        <label for="password" class="mb-2 text-sm font-medium text-gray-700">
          Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Default: student123"
          class="w-full border py-4 px-3 rounded border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary"
          [disabled]="loading"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-primary text-white py-4 rounded hover:opacity-90 transition disabled:opacity-70 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

      <!-- Secondary Links -->
      <div class="flex flex-col items-center gap-3 pt-4 text-sm text-gray-600">

        <div>
          Don’t have an account?
          <a routerLink="/signup" class="text-primary font-medium hover:underline">
            Sign up
          </a>
        </div>

        <div class="flex gap-4">
          <a routerLink="/forgot-password" class="hover:underline">
            Forgot password?
          </a>
          <a routerLink="/support" class="hover:underline">
            Need help?
          </a>
        </div>

      </div>

    </form>
  </div>

</div>
