name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  course-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: ./mvnw -q -DskipTests compile
      - name: Test
        run: ./mvnw -q test

  enrollment-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Enrollment-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: ./mvnw -q -DskipTests compile
      - name: Test
        run: ./mvnw -q test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esm-front-main
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: esm-front-main/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
