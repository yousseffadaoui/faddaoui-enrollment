name: CD - Course Service

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI - Course Service"]
    types:
      - completed

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Kubernetes deployment files
        run: |
          echo "CD Course Service started"
          ls -la course-service/k8s
          cat course-service/k8s/course-deployment.yml
          cat course-service/k8s/course-service.yaml
