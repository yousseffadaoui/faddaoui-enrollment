name: Enrollment-service CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: enrollment-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE_DIR: Enrollment-service
  IMAGE_NAME: enrollment-service
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/enrollment-service

jobs:
  docker-build-push:
    name: Build & Push Docker image (Docker Hub)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SERVICE_DIR }}
          file: ${{ env.SERVICE_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Upload Kubernetes manifests (for deployment step)
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifests
          path: ${{ env.SERVICE_DIR }}/k8s

