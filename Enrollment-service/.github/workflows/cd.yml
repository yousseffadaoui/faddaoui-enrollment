name: Enrollment-service CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: enrollment-service
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/enrollment-service
  K8S_NAMESPACE: default

jobs:
  build-test-jacoco-sonar:
    name: Build, Test, JaCoCo, SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven - clean verify (tests + JaCoCo XML)
        run: ./mvnw -B clean verify

      - name: SonarQube analysis
        if: ${{ secrets.SONAR_TOKEN != '' && vars.SONAR_HOST_URL != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL }} \
            -Dsonar.login=${SONAR_TOKEN}

  docker-build-push:
    name: Docker build & push (Docker Hub)
    runs-on: ubuntu-latest
    needs: [build-test-jacoco-sonar]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Build and push (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}

  kubernetes-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build-push]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "${HOME}/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply manifests
        run: |
          kubectl apply -n "${{ env.K8S_NAMESPACE }}" -f k8s/

      - name: Update image
        run: |
          kubectl set image -n "${{ env.K8S_NAMESPACE }}" deployment/${{ env.APP_NAME }} \
            ${{ env.APP_NAME }}=${{ env.DOCKER_IMAGE }}:${{ github.sha }} --record
          kubectl rollout status -n "${{ env.K8S_NAMESPACE }}" deployment/${{ env.APP_NAME }} --timeout=180s

